<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="AILab: from the neuron to robotics with AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glow)"/>
  <!-- a small neural network, drawn as edges and nodes -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M820 70 L960 45 M820 70 L960 125 M820 70 L960 205 M820 150 L960 45 M820 150 L960 125 M820 150 L960 205 M820 230 L960 45 M820 230 L960 125 M820 230 L960 205"/>
    <path d="M960 45 L1100 85 M960 45 L1100 175 M960 125 L1100 85 M960 125 L1100 175 M960 205 L1100 85 M960 205 L1100 175"/>
  </g>
  <g fill="#EEF2FF" stroke="#FFFFFF" stroke-width="3">
    <circle cx="820" cy="70" r="15"/><circle cx="820" cy="150" r="15"/><circle cx="820" cy="230" r="15"/>
  </g>
  <g fill="#FEF3C7" stroke="#FFFFFF" stroke-width="3">
    <circle cx="960" cy="45" r="15"/><circle cx="960" cy="125" r="15"/><circle cx="960" cy="205" r="15"/>
  </g>
  <g fill="#CCFBF1" stroke="#FFFFFF" stroke-width="3">
    <circle cx="1100" cy="85" r="15"/><circle cx="1100" cy="175" r="15"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="70" y="128" font-size="84" font-weight="800" letter-spacing="-2">AILab</text>
    <text x="74" y="178" font-size="29" font-weight="500" fill-opacity="0.92">From the neuron to robotics with AI</text>
    <text x="74" y="228" font-size="19" fill-opacity="0.78">NumPy first, then PyTorch  ·  lessons, notebooks and projects, built in public</text>
  </g>
</svg>
